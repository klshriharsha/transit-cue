allowBuilds:
  sharp: false
  unrs-resolver: false
# vbb-hafas (transit station/departure lookups) depends on vbb-change-positions, which is
# published only via GitHub, not the npm registry. pnpm blocks git-hosted transitive
# dependencies by default as a supply-chain guard; this is a known, required part of
# vbb-hafas's dependency tree, not an unreviewed package.
blockExoticSubdeps: false
